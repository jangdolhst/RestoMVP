<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ticket de Pedido</title>
  <style>
    @page {
      margin: 0;
      size: 80mm auto;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      color: #000;
      background: #fff;
      width: 80mm;
      padding: 3mm 4mm;
      margin: 0 auto;
    }

    @media print {
      .no-print { display: none !important; }
      body { padding: 0 2mm; }
    }

    .divider {
      border: none;
      border-top: 1px dashed #000;
      margin: 6px 0;
    }

    .divider-double {
      border: none;
      border-top: 2px solid #000;
      margin: 6px 0;
    }

    .header {
      text-align: center;
      margin-bottom: 4px;
    }

    .biz-logo {
      max-width: 60px;
      max-height: 60px;
      margin: 0 auto 4px;
      display: none;
    }

    .biz-name {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 1px;
    }

    .biz-fiscal {
      font-size: 10px;
      color: #333;
    }

    .biz-address {
      font-size: 9px;
      color: #555;
      line-height: 1.4;
    }

    .biz-phone {
      font-size: 9px;
      color: #555;
    }

    .order-badge {
      text-align: center;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      margin: 6px 0 2px;
    }

    .order-type {
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .info-line {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      line-height: 1.6;
    }

    .info-label { color: #555; }
    .info-value { font-weight: bold; }

    .items-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .items-table th {
      text-align: left;
      padding-bottom: 3px;
      font-size: 10px;
      border-bottom: 1px solid #000;
    }

    .items-table th:last-child { text-align: right; }

    .items-table td {
      padding: 3px 0;
      vertical-align: top;
    }

    .col-qty { width: 12%; }
    .col-name { width: 58%; }
    .col-price { width: 30%; text-align: right; }

    .mod-line {
      font-size: 9px;
      padding-left: 4px;
      color: #333;
    }

    .subtotal-line {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-top: 4px;
    }

    .tax-line {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
    }

    .total-line {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: 900;
      margin-top: 4px;
    }

    .tax-note {
      text-align: center;
      font-size: 8px;
      color: #777;
      margin-top: 2px;
    }

    .footer {
      text-align: center;
      font-size: 10px;
      margin-top: 10px;
      color: #555;
      line-height: 1.5;
    }

    .footer-brand {
      font-size: 8px;
      color: #999;
      margin-top: 6px;
      letter-spacing: 1px;
    }

    .btn-print {
      display: block;
      width: 100%;
      padding: 12px;
      background: #111;
      color: #fff;
      text-align: center;
      border: none;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
      border-radius: 6px;
    }

    .btn-print:hover { background: #333; }

    .error-msg {
      text-align: center;
      padding: 20px;
      color: #c00;
      font-size: 13px;
      font-weight: bold;
    }

    #ticket-content { display: none; }
  </style>
</head>
<body>
  <button id="ticket-print-btn" class="btn-print no-print" type="button">Imprimir Ticket</button>

  <div id="ticket-error" class="error-msg" style="display:none;"></div>

  <div id="ticket-content">
    <div class="header">
      <img id="tk-logo" class="biz-logo" alt="Logo" />
      <div class="biz-name" id="tk-biz">JAMM FREE</div>
      <div class="biz-fiscal" id="tk-fiscal" style="display:none;"></div>
      <div class="biz-address" id="tk-address" style="display:none;"></div>
      <div class="biz-phone" id="tk-phone-biz" style="display:none;"></div>
    </div>

    <hr class="divider-double">

    <div class="order-badge" id="tk-number">#001</div>
    <div class="order-type" id="tk-type">PARA LLEVAR</div>

    <hr class="divider">

    <div class="info-line">
      <span id="tk-label-folio" class="info-label">Folio:</span>
      <span class="info-value" id="tk-folio">-</span>
    </div>
    <div class="info-line">
      <span id="tk-label-client" class="info-label">Cliente:</span>
      <span class="info-value" id="tk-client">-</span>
    </div>
    <div class="info-line">
      <span id="tk-label-date" class="info-label">Fecha:</span>
      <span class="info-value" id="tk-date">-</span>
    </div>
    <div class="info-line">
      <span id="tk-label-time" class="info-label">Hora:</span>
      <span class="info-value" id="tk-time">-</span>
    </div>
    <div id="tk-waiter-row" class="info-line" style="display:none;">
      <span id="tk-label-waiter" class="info-label">Mesero:</span>
      <span class="info-value" id="tk-waiter">-</span>
    </div>

    <hr class="divider-double">

    <table class="items-table">
      <thead>
        <tr>
          <th id="tk-head-qty" class="col-qty">Cant</th>
          <th id="tk-head-item" class="col-name">Articulo</th>
          <th id="tk-head-subtotal" class="col-price">Subtotal</th>
        </tr>
      </thead>
      <tbody id="tk-items"></tbody>
    </table>

    <hr class="divider-double">

    <div id="tk-subtotal-row" class="subtotal-line" style="display:none;">
      <span id="tk-label-subtotal">Subtotal</span>
      <span id="tk-subtotal">$0.00</span>
    </div>
    <div id="tk-tax-row" class="tax-line" style="display:none;">
      <span id="tk-tax-label">Impuesto (16%)</span>
      <span id="tk-tax-amount">$0.00</span>
    </div>

    <div class="total-line">
      <span id="tk-label-total">TOTAL</span>
      <span id="tk-total">$0.00</span>
    </div>

    <div id="tk-tax-note" class="tax-note" style="display:none;">
      * Impuesto incluido en el precio
    </div>

    <hr class="divider">

    <div class="footer">
      <span id="tk-footer-thanks">Gracias por tu preferencia</span><br>
      <span id="tk-footer-return">Te esperamos pronto</span>
    </div>
    <div class="footer-brand">Powered by JAMM FREE</div>
  </div>

  <script src="/pos_ticket.js"></script>
</body>
</html>
